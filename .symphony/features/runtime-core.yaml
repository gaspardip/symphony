id: runtime-core
title: Runtime Core
status: active
summary: Runtime-owned delivery stages, recovery, proof gates, publish lifecycle, persisted review-claim state, autonomous webhook-driven review verification, webhook-driven CI failure reopening for failing PR checks, evidence-based review follow-up with non-actionable noise suppression, operator-visible lease and webhook assignment state, runner identity plus lease-backed channel-aware issue and webhook routing seams for stable ingress and isolated runner pools, a stable-ingress webhook relay bridge for healthy canary runners, repo-native runner promotion controls, token-aware resume context that narrows review-driven implement turns to the accepted PR claim scope, high-pressure prompt trimming that reduces accepted review batches to one claim and removes duplicated review context, conditional review-fix budget fallback that relaxes implement token caps only after repeated soft-pressure retries, a dedicated higher turn ceiling for high-pressure scoped review-fix implement runs, a bounded second-step review-fix budget bump to `85k/150k` after prior pressure is already recorded, a bounded third-stage review-fix budget bump to `110k/220k` once a scoped retry window is active, a bounded review-fix-only `per_issue_total` extension once accepted claim progress is already proven, an extra-tight shell/output budget for high-pressure scoped review-fix turns, live running-entry workspace/stage alignment for budget checks, a scoped review-fix turn window that counts retries from the latest blocked-review resume instead of the issue-wide implementation total, live review-fix budget-stop persistence that writes retry evidence back into `run_state.json` and can recover retry-count signals from prior budget stops, automatic retirement of successfully addressed scoped review claims from the next focused prompt including absolute workspace path matches, implement-stage preflight proof refresh for unresolved `needs_verification` review claims, stage-entry GitHub review reconciliation that refreshes live `review_threads` and `review_claims` before `implement`, `validate`, `review_verification`, `publish`, `merge_readiness`, or `await_checks` continue, an explicit passive `merge_readiness` stage between publish and check polling that can reapply a valid PR body after `validate-pr-description` failures and reconcile posted review-thread state before merge decisions, merge-readiness-specific failure classification and operator guidance, explicit `last_merge_readiness` exposure in running and issue-level operator payloads, dispatch-stage-aware merge-readiness restart controls for already-running passive merge-side work, direct validate-resume from retained scoped review-fix diffs once no accepted actionable claims remain, automatic orchestrator continuation for blocked review-fix budget stops that already made claim progress even when only retry-budget state remains, direct continuation scheduling from the token-budget stop path, stale-snapshot retry resume that trusts the persisted blocked workspace state over the in-memory issue shell, resumed-manual dispatch protection that keeps a locally resumed `Merging` issue active even when the manual-store refresh is still blocked, seeded-manual retry recovery that can resume a persisted active stage even after the top-level blocked marker is lost, fail-soft turn-result normalization for noisy blocker types instead of crashing the whole turn contract, fail-soft downgrade of runtime-owned git/publication blockers that agents should not own in implement turns, seeded manual retry-state repair so blocked local replays resume the stored stage instead of redispatching a blocked run unchanged, seeded manual redispatch fallback so resumed local replays stay dispatchable even when no manual-store issue record exists, metadata-only workspace bootstrap recovery that reruns `after_create` while merging preserved `.symphony` runtime state back into the checked-out repo, staged bootstrap run-state fallback so operator reads and dispatch helpers can still see runtime state while metadata is temporarily parked during checkout, lightweight operator inspection that avoids live `gh pr view` calls and rebuilds review/check payloads from persisted run-state fields, explicit `retry_now` dispatch outcome diagnostics that surface no-slot and no-dispatch control decisions through the ledger and issue detail payloads, routing-consistent tracker identifier lookups that preserve `assigned_to_worker` semantics across issue detail and retry control paths, exact local-pattern proof upgrades for stale review claims, required-check rollups that recognize both GitHub workflow names and emitted check-run names, and autonomous inline PR review reply promotion/posting and safe thread resolution for addressed or contradicted claims once a fully autonomous run has an attached PR URL.
